services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: drive
      POSTGRES_USER: drive
      POSTGRES_PASSWORD: drive_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - drive_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drive -d drive"]
      interval: 5s
      timeout: 3s
      retries: 10
  portal:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://drive:drive_local_only@db:5432/drive
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  drive_data:
